steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}'
      - '--build-arg'
      - 'VITE_BACKEND_API_URL=${_VITE_BACKEND_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BACKEND_API_URL=${_VITE_BACKEND_API_URL}'
      - '-t'
      - '${_IMAGE_REPO}/admin-dashboard:${_IMAGE_TAG}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_REPO}/admin-dashboard:${_IMAGE_TAG}'

images:
  - '${_IMAGE_REPO}/admin-dashboard:${_IMAGE_TAG}'

substitutions:
  _VITE_SUPABASE_ANON_KEY: ''
  _VITE_SUPABASE_URL: 'https://exfvfyiwftywqjcsofgf.supabase.co'
  _VITE_BACKEND_API_URL: 'https://api.orchestree.biz.id/api/v1'
  _IMAGE_REPO: 'asia-southeast2-docker.pkg.dev/orchestree-ai/orchestreeai-images'
  _IMAGE_TAG: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY
